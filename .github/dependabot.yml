version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    groups:
      root-safe-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "@anthropic-ai/sdk"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "chokidar"
        update-types:
          - "version-update:semver-major"
      # express 5 and js-yaml 5 are migrations, not bumps (js-yaml 5 loads
      # YAML 1.2: unquoted dates become strings, empty input throws).
      - dependency-name: "express"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "js-yaml"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/graph-memory-plugin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    groups:
      plugin-safe-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # js-yaml 5 loads YAML 1.2 by default: node frontmatter dates would load
      # as strings and empty frontmatter would throw. Migrate deliberately.
      - dependency-name: "js-yaml"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/memory-dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    groups:
      dashboard-safe-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # vite and @vitejs/plugin-react move together: plugin-react 4 peers on
      # vite <= 7, so a vite-only major bump fails `npm ci` with ERESOLVE.
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "chokidar"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "express"
        update-types:
          - "version-update:semver-major"
      # Same YAML 1.2 migration as the plugin: frontmatter.ts parses node files.
      - dependency-name: "js-yaml"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
